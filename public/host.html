<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zughi del KJB · Console Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800;900&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap wide" id="app"></div>

  <script src="/qr.js"></script>
  <script src="/app.js"></script>
  <script>
    const A = $('#app');
    let H = {}, theme = '', mode = 'impostor', last = '';
    let useAi = true;
    let macroSection = 'games'; // 'games' | 'utilities'
    let activePresetId = 'fanta';
    let customAiPrompt = '';
    let lobbyRendered = false; // Fix 1: tracks whether the lobby skeleton has been rendered

    // Wheel of Fortune State
    let wheelMode = 'players'; // 'players' | 'challenges' | 'teams'
    let wheelAngle = 0;
    let isSpinning = false;
    let wheelResult = null;
    let currentPlayers = [];

    // External Links State (stored in localStorage)
    let externalLinks = [];
    try {
      const stored = localStorage.getItem('kjb_external_links');
      externalLinks = stored ? JSON.parse(stored) : [...DEFAULT_EXTERNAL_LINKS];
    } catch (e) {
      externalLinks = [...DEFAULT_EXTERNAL_LINKS];
    }
    externalLinks = Array.isArray(externalLinks)
      ? externalLinks.filter(item => item && typeof item === 'object').slice(0, 100)
      : [...DEFAULT_EXTERNAL_LINKS];
    const saveExternalLinks = () => {
      try { localStorage.setItem('kjb_external_links', JSON.stringify(externalLinks)); } catch(e) {}
    };
    const safeExternalUrl = value => {
      try {
        const url = new URL(value);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
      } catch (e) { return ''; }
    };

    const HOST_MODES = [
      { id: 'impostor', name: "L'Impostore", icon: '🕵️', desc: "Tutti una domanda tranne uno. Chi è fuori tema prima che vi freghi?" },
      { id: 'best', name: 'Miglior Risposta', icon: '🏆', desc: "Sfida aperta alla risposta più assurda o geniale. Votate la migliore!" },
      { id: 'likely', name: 'Chi è più probabile?', icon: '👀', desc: "Votazione diretta tra i compagni connessi alla partita." }
    ];

    const btn = (id, t, c) => `<button class="btn ${c || ''}" id="${id}">${t}</button>`;
    const act = (t, customMode, customTheme, customAi) => {
      const m = customMode || mode;
      const th = customTheme !== undefined ? customTheme : theme;
      const aiFlag = customAi !== undefined ? customAi : useAi;
      return api({ id: 'host', token: H.token, type: t, theme: th, mode: m, ai: aiFlag });
    };
    const bind = ids => ids.forEach(i => { const b = $('#' + i); if (b) b.onclick = () => act(i); });

    function drawQR() {
      const q = qrcode(0, 'M');
      const joinUrl = location.origin + '/?r=' + ROOM;
      q.addData(joinUrl);
      q.make();
      const qrEl = $('#qr');
      if (qrEl) qrEl.innerHTML = q.createSvgTag(5, 2);
    }

    function renderHostHeader() {
      return `
        <header class="brand-header" style="margin-bottom:16px">
          <div class="brand-badge">
            ${kjbCrestSvg(54)}
            <div class="brand-title-wrap">
              <span class="brand-title" style="font-size:26px">Zughi del KJB</span>
              <span class="brand-subtitle">Console Host • Dashboard della Serata</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px">
            <span class="status-pill">
              <span class="status-dot"></span>
              Stanza Live: <b style="color:var(--text-main);margin-left:4px">${ROOM}</b>
            </span>
          </div>
        </header>
      `;
    }

    function lobby(v) {
      currentPlayers = v.players ? v.players.filter(p => p.online) : [];
      const n = currentPlayers.length;

      // Preserve any custom AI prompt input typed by the host before re-render
      const promptInput = $('#custom-prompt-input');
      if (promptInput) customAiPrompt = promptInput.value;

      // Differential DOM update if lobby was already rendered and phase hasn't changed
      if (lobbyRendered && last === 'lobby') {
        const countPill = $('#player-count-pill');
        if (countPill) countPill.textContent = `${n} Connessi`;

        const ch = $('#ch');
        if (ch) ch.innerHTML = v.players.length ? tiles(v.players, 'online') : '<span style="color:var(--text-dim);font-size:14px">In attesa che i telefoni inquadrino il QR code...</span>';

        const warnEl = $('#roster-warning');
        if (warnEl) warnEl.innerHTML = n < 3 ? '<small style="color:var(--gold)">⚠️ Servono almeno 3 giocatori per avviare una partita interna.</small>' : '';

        const activeGameObj = HOST_MODES.find(m => m.id === mode) || HOST_MODES[0];
        const btnCat = $('#start-catalog');
        if (btnCat) {
          btnCat.disabled = n < 3;
          btnCat.innerHTML = `<span>🚀 Avvia ${esc(activeGameObj.name)} ${n < 3 ? `(${n}/3 giocatori)` : ''}</span>`;
        }

        const btnCustom = $('#start-custom-ai');
        if (btnCustom) btnCustom.disabled = n < 3;

        const btnRand = $('#start-randomizer');
        if (btnRand) btnRand.disabled = n < 3;

        return;
      }

      lobbyRendered = true;

      A.innerHTML = `
        ${renderHostHeader()}

        <!-- Macro Navigation Bar: Giochi Interni vs Utility & Sfide -->
        <nav class="macro-nav">
          <button class="macro-nav-btn ${macroSection === 'games' ? 'active' : ''}" id="nav-games">
            <span style="font-size:20px">🎮</span>
            <span>Giochi Interni del Club</span>
          </button>
          <button class="macro-nav-btn ${macroSection === 'utilities' ? 'active' : ''}" id="nav-utilities">
            <span style="font-size:20px">🎡</span>
            <span>Utility & Sfide Esterne (Ruota & Web)</span>
          </button>
        </nav>

        <div class="host-layout">
          <!-- Left Column (340px): Stanza Live, PIN, QR Code & Rosa Giocatori -->
          <div style="display:flex;flex-direction:column;gap:20px">
            <div class="room-pin-display">
              <small style="color:var(--gold);font-weight:800;letter-spacing:0.08em;text-transform:uppercase">INQUADRA O DIGITA IL CODICE</small>
              <div class="bigcode">${ROOM}</div>
              <div id="qr"></div>
              <p style="font-size:14px;color:var(--text-muted);margin-top:6px">
                Collegati a <b style="color:var(--text-main)">${esc(location.host)}</b> con il tuo telefono
              </p>
            </div>

            <div class="card elevated">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <h3>Rosa Giocatori</h3>
                <span class="status-pill" id="player-count-pill">${n} Connessi</span>
              </div>
              <div id="ch">
                ${v.players.length ? tiles(v.players, 'online') : '<span style="color:var(--text-dim);font-size:14px">In attesa che i telefoni inquadrino il QR code...</span>'}
              </div>
              <div id="roster-warning">${n < 3 ? '<small style="color:var(--gold)">⚠️ Servono almeno 3 giocatori per avviare una partita interna.</small>' : ''}</div>
            </div>
          </div>

          <!-- Right Column: Main Content based on Macro Section -->
          <div style="display:flex;flex-direction:column;gap:20px" id="macro-content">
            ${macroSection === 'games' ? renderGamesSection(n, v) : renderUtilitiesSection(n, v)}
          </div>
        </div>
      `;

      drawQR();

      // Navigation listeners
      $('#nav-games').onclick = () => {
        macroSection = 'games';
        lobbyRendered = false;
        lobby(v);
      };
      $('#nav-utilities').onclick = () => {
        macroSection = 'utilities';
        lobbyRendered = false;
        lobby(v);
        initWheel();
      };

      if (macroSection === 'games') {
        bindGamesEvents(v);
      } else {
        bindUtilitiesEvents(v);
      }
    }

    // ==========================================
    // MACRO AREA 1: GIOCHI INTERNI DEL CLUB
    // ==========================================
    function renderGamesSection(n, v) {
      const activeGameObj = HOST_MODES.find(m => m.id === mode) || HOST_MODES[0];

      return `
        <!-- Opzione 1: Selezione Gioco dal Catalogo -->
        <div class="card elevated" style="gap:16px">
          <div class="section-title-row">
            <div>
              <h3>1. Avvia un Gioco dal Catalogo</h3>
              <p class="subtext">Scegli una delle modalità ufficiali del Club</p>
            </div>
            <span style="font-size:13px;color:var(--gold);font-weight:700">Partita a Turni</span>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px">
            ${HOST_MODES.map(m => `
              <div class="game-card ${m.id === mode ? 'active-selected' : ''}" data-m="${m.id}" style="padding:16px">
                <div style="display:flex;align-items:center;gap:10px">
                  <span style="font-size:26px">${m.icon}</span>
                  <div style="font-weight:800;font-family:var(--font-disp);font-size:17px">${esc(m.name)}</div>
                </div>
                <div style="font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.4">${esc(m.desc)}</div>
              </div>
            `).join('')}
          </div>

          <!-- Toggle Elegante per Uso IA -->
          <div class="toggle-switch-wrap">
            <div style="display:flex;flex-direction:column">
              <b style="color:var(--text-main);font-size:15px">Generazione Domande con IA</b>
              <small style="color:var(--text-muted);margin-top:2px">
                ${useAi 
                  ? '✨ Attiva: L\'IA genera quesiti inediti e li adatta al tema/preset scelto.' 
                  : '📦 Disattivata: Vengono usate le domande preimpostate del database offline.'}
              </small>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="ai-toggle" ${useAi ? 'checked' : ''}>
              <span class="toggle-slider"></span>
            </label>
          </div>

          <!-- Presets veloci (attivi solo se l'IA è abilitata) -->
          ${useAi ? `
            <div style="display:flex;flex-direction:column;gap:8px">
              <small style="font-weight:800;color:var(--gold);letter-spacing:0.04em">PRESET DI ARGOMENTI PER IL GIOCO:</small>
              <div class="presets-container">
                ${AI_PRESETS.map(p => `
                  <button class="preset-chip ${p.id === activePresetId ? 'active' : ''}" data-p="${p.id}">
                    <span>${p.icon}</span>
                    <span>${esc(p.title)}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <button class="btn" id="start-catalog" ${n < 3 ? 'disabled' : ''}>
            <span>🚀 Avvia ${esc(activeGameObj.name)} ${n < 3 ? `(${n}/3 giocatori)` : ''}</span>
          </button>
        </div>

        <!-- Opzione 2: Creazione Gioco con Prompt Diretto all'IA -->
        <div class="ai-director-card">
          <div class="ai-header-row">
            <div class="ai-sparkle-title">
              <span class="ai-sparkle-icon">✨</span>
              <span>2. Crea con Prompt Diretto all'IA</span>
            </div>
            <span class="status-pill" style="font-size:12px;padding:4px 10px">Modalità Regista IA</span>
          </div>

          <p class="subtext" style="font-size:14px">
            Inserisci istruzioni libere per l'IA: inventerà quesiti ad hoc, regole speciali o adatterà la sfida ad aneddoti specifici del vostro gruppo.
          </p>

          <textarea class="ai-textarea" id="custom-prompt-input" maxlength="500" placeholder="Es: Crea un round a tema calcio o viaggi, senza usare dati personali...">${esc(customAiPrompt)}</textarea>
          <small class="subtext">Se attivi l’IA, il testo del prompt e le domande recenti vengono inviati al provider configurato. Evita nomi, dati personali o informazioni sensibili. <a href="/privacy" target="_blank" rel="noopener noreferrer">Informativa privacy</a></small>
          
          <div style="display:flex;justify-content:space-between;align-items:center">
            <small style="color:var(--text-dim)" id="prompt-count">${customAiPrompt.length}/500 caratteri</small>
            <button class="btn rose" id="start-custom-ai" style="width:auto;padding:12px 24px" ${n < 3 ? 'disabled' : ''}>
              <span>✨ Genera & Avvia Gioco IA</span>
            </button>
          </div>
        </div>

        <!-- Opzione 3: Randomizer (Scelta Casuale) -->
        <div class="randomizer-box">
          <div style="display:flex;align-items:center;gap:16px">
            <span style="font-size:38px">🎲</span>
            <div>
              <h3 style="font-size:19px">3. Scelta Casuale (Randomizer)</h3>
              <p class="subtext" style="font-size:14px;margin-top:2px">
                Lascia decidere al fato: estrae una modalità a sorpresa e lancia subito il match.
              </p>
            </div>
          </div>
          <button class="btn secondary" id="start-randomizer" style="width:auto;min-width:220px;padding:14px 20px" ${n < 3 ? 'disabled' : ''}>
            <span>🎲 Avvia Gioco a Sorpresa</span>
          </button>
        </div>
      `;
    }

    function bindGamesEvents(v) {
      // Game card clicks
      document.querySelectorAll('[data-m]').forEach(b => {
        b.onclick = () => {
          mode = b.dataset.m;
          lobbyRendered = false;
          lobby(v);
        };
      });

      // AI toggle
      const aiToggle = $('#ai-toggle');
      if (aiToggle) {
        aiToggle.onchange = e => {
          useAi = e.target.checked;
          lobbyRendered = false;
          lobby(v);
        };
      }

      // Presets
      document.querySelectorAll('[data-p]').forEach(chip => {
        chip.onclick = () => {
          activePresetId = chip.dataset.p;
          const found = AI_PRESETS.find(p => p.id === activePresetId);
          if (found) theme = found.prompt;
          lobbyRendered = false;
          lobby(v);
        };
      });

      // Start from catalog
      const btnCatalog = $('#start-catalog');
      if (btnCatalog) {
        btnCatalog.onclick = () => {
          act('start', mode, theme, useAi);
        };
      }

      // Custom AI prompt
      const promptInput = $('#custom-prompt-input');
      if (promptInput) {
        promptInput.oninput = e => {
          customAiPrompt = e.target.value;
          const cnt = $('#prompt-count');
          if (cnt) cnt.textContent = customAiPrompt.length + '/500 caratteri';
        };
      }

      const btnCustomAi = $('#start-custom-ai');
      if (btnCustomAi) {
        btnCustomAi.onclick = () => {
          const finalPrompt = customAiPrompt.trim() || 'Crea un gioco divertente e creativo a sorpresa tra amici maggiorenni.';
          act('start', 'auto', finalPrompt, true);
        };
      }

      // Randomizer button
      const btnRandom = $('#start-randomizer');
      if (btnRandom) {
        btnRandom.onclick = () => {
          const randMode = pick(['impostor', 'best', 'likely']);
          const randPreset = pick(AI_PRESETS);
          const randAi = Math.random() > 0.2; // 80% chance AI
          act('start', randMode, randPreset ? randPreset.prompt : '', randAi);
        };
      }
    }

    // ==========================================
    // MACRO AREA 2: UTILITY E SFIDE ESTERNE
    // ==========================================
    function renderUtilitiesSection(n, v) {
      return `
        <!-- Componente: Ruota della Fortuna -->
        <div class="card elevated" style="gap:18px">
          <div class="section-title-row">
            <div>
              <h3>🎡 Ruota della Fortuna KJB</h3>
              <p class="subtext">Sorteggia giocatori per penitenze, crea squadre casuali o estrai sfide</p>
            </div>
            <div class="tabs-bar" style="padding:2px">
              <button class="tab-btn ${wheelMode === 'players' ? 'active' : ''}" id="wheel-tab-players" style="padding:6px 12px;font-size:13px">👥 Giocatori</button>
              <button class="tab-btn ${wheelMode === 'teams' ? 'active' : ''}" id="wheel-tab-teams" style="padding:6px 12px;font-size:13px">🏆 Team A/B</button>
              <button class="tab-btn ${wheelMode === 'challenges' ? 'active' : ''}" id="wheel-tab-challenges" style="padding:6px 12px;font-size:13px">🔥 Penitenze</button>
            </div>
          </div>

          <div class="wheel-wrapper">
            <div class="wheel-frame">
              <div class="wheel-pointer"></div>
              <canvas class="wheel-canvas" id="wheel-canvas" width="600" height="600"></canvas>
              <div class="wheel-center-cap">⚽</div>
            </div>

            <div style="margin-top:16px;width:100%;max-width:320px">
              <button class="btn" id="btn-spin-wheel" ${isSpinning ? 'disabled' : ''}>
                <span>🎡 ${isSpinning ? 'La Ruota sta girando...' : 'Gira la Ruota!'}</span>
              </button>
            </div>

            <div class="wheel-result-banner" id="wheel-result-banner">
              ${wheelResult 
                ? `<b style="color:var(--gold);font-size:18px">🏆 Estratto: ${esc(wheelResult)}</b>` 
                : '<span style="color:var(--text-muted);font-size:14px">Premi il pulsante per effettuare il sorteggio live.</span>'}
            </div>
          </div>
        </div>

        <!-- Componente: Archivio Sfide Web & Siti Terzi -->
        <div class="card elevated" style="gap:18px">
          <div class="section-title-row">
            <div>
              <h3>🌐 Archivio Sfide Esterne</h3>
              <p class="subtext">Lancia sfide e giochi online su piattaforme terze senza perdere la stanza</p>
            </div>
            <span class="status-pill">${externalLinks.length} Siti Salvati</span>
          </div>

          <!-- Lista Cliccabile dei Link -->
          <div class="ext-links-list" id="ext-links-container">
            ${externalLinks.map((item, idx) => `
              <div class="ext-link-item">
                <div class="ext-link-info">
                  <div class="ext-link-icon">${esc(item.icon || '🔗')}</div>
                  <div class="ext-link-texts">
                    <span class="ext-link-title">${esc(item.title)}</span>
                    <span class="ext-link-url">${esc(item.url)}</span>
                    ${item.desc ? `<small style="color:var(--text-dim);margin-top:2px">${esc(item.desc)}</small>` : ''}
                  </div>
                </div>
                <div class="ext-link-actions">
                  ${safeExternalUrl(item.url) ? `<a class="btn secondary" href="${esc(safeExternalUrl(item.url))}" target="_blank" rel="noopener noreferrer" style="width:auto;padding:8px 16px;font-size:14px"><span>Apri Sito ↗</span></a>` : '<span class="subtext">Link non valido</span>'}
                  ${idx >= 2 ? `
                    <button class="btn ghost" style="width:auto;padding:8px;color:var(--rose)" data-delete-link="${idx}" title="Rimuovi link">
                      🗑️
                    </button>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- Modulo Aggiunta Nuovo Link -->
          <div style="background:rgba(0,0,0,0.25);padding:16px;border-radius:var(--radius-sm);border:1px dashed var(--border);display:flex;flex-direction:column;gap:12px">
            <b style="font-size:14px;color:var(--gold)">+ AGGIUNGI UN NUOVO SITO O SFIDA WEB ALL'ARCHIVIO:</b>
            <div style="display:grid;grid-template-columns:1fr 1.5fr auto;gap:10px">
              <input class="txt" id="new-link-title" placeholder="Nome (es. Codenames)" style="padding:10px 14px;font-size:14px">
              <input class="txt" id="new-link-url" placeholder="Indirizzo (es. https://...)" style="padding:10px 14px;font-size:14px">
              <button class="btn" id="btn-add-link" style="width:auto;padding:10px 18px;font-size:14px">
                Aggiungi
              </button>
            </div>
            <div class="err" id="link-err" style="font-size:13px;min-height:auto"></div>
          </div>
        </div>
      `;
    }

    function bindUtilitiesEvents(v) {
      // Wheel tabs
      const tabP = $('#wheel-tab-players');
      const tabT = $('#wheel-tab-teams');
      const tabC = $('#wheel-tab-challenges');
      if (tabP) tabP.onclick = () => { wheelMode = 'players'; wheelResult = null; lobby(v); };
      if (tabT) tabT.onclick = () => { wheelMode = 'teams'; wheelResult = null; lobby(v); };
      if (tabC) tabC.onclick = () => { wheelMode = 'challenges'; wheelResult = null; lobby(v); };

      // Spin button
      const spinBtn = $('#btn-spin-wheel');
      if (spinBtn) {
        spinBtn.onclick = () => spinWheelAction(v);
      }

      // Add link button
      const addLinkBtn = $('#btn-add-link');
      if (addLinkBtn) {
        addLinkBtn.onclick = () => {
          const tInput = $('#new-link-title');
          const uInput = $('#new-link-url');
          const errEl = $('#link-err');
          const title = tInput.value.trim();
          let url = uInput.value.trim();

          if (!title) { errEl.textContent = 'Inserisci un nome per il sito o sfida.'; return; }
          if (title.length > 80 || url.length > 2000) { errEl.textContent = 'Il nome deve avere al massimo 80 caratteri e il link 2000.'; return; }
          if (!url) { errEl.textContent = 'Inserisci l\'URL del sito.'; return; }
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
          }
          if (!safeExternalUrl(url)) { errEl.textContent = 'Inserisci un indirizzo web valido (http o https).'; return; }
          if (externalLinks.length >= 100) { errEl.textContent = 'Hai raggiunto il limite di 100 link salvati.'; return; }

          externalLinks.push({
            id: 'custom-' + Date.now(),
            title,
            url,
            icon: '🎲',
            desc: 'Sfida web personalizzata aggiunta dall\'host.'
          });
          saveExternalLinks();
          lobby(v);
        };
      }

      // Delete custom link
      document.querySelectorAll('[data-delete-link]').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.deleteLink, 10);
          if (!isNaN(idx)) {
            externalLinks.splice(idx, 1);
            saveExternalLinks();
            lobby(v);
          }
        };
      });
    }

    // ==========================================
    // WHEEL OF FORTUNE ENGINE (CANVAS)
    // ==========================================
    function getWheelItems() {
      if (wheelMode === 'players') {
        const names = currentPlayers.map(p => p.name);
        if (names.length >= 2) return names;
        return ['Bomber 1', 'Bomber 2', 'Bomber 3', 'Bomber 4'];
      }
      if (wheelMode === 'teams') {
        return ['Team Oro 🟡', 'Team Verde 🟢', 'Team Rosa 🔴', 'Team Blu 🔵'];
      }
      return DEFAULT_WHEEL_CHALLENGES;
    }

    function drawWheelOnCanvas() {
      const canvas = $('#wheel-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = w / 2 - 12;

      ctx.clearRect(0, 0, w, h);

      const items = getWheelItems();
      const numSlices = items.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const sliceColors = ['#f59e0b', '#10b981', '#f43f5e', '#3b82f6', '#8b5cf6', '#06b6d4', '#eab308', '#ec4899'];

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(wheelAngle);

      for (let i = 0; i < numSlices; i++) {
        const start = i * sliceAngle;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#090d16';
        ctx.stroke();

        // Label drawing
        ctx.save();
        ctx.rotate(start + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#0b0f19';
        ctx.font = 'bold 22px "Bricolage Grotesque", sans-serif';

        let text = items[i];
        if (text.length > 18) text = text.slice(0, 16) + '…';
        ctx.fillText(text, radius - 24, 8);
        ctx.restore();
      }

      ctx.restore();
    }

    function initWheel() {
      drawWheelOnCanvas();
    }

    function spinWheelAction(v) {
      if (isSpinning) return;
      isSpinning = true;
      wheelResult = null;

      const spinBtn = $('#btn-spin-wheel');
      if (spinBtn) spinBtn.disabled = true;

      const items = getWheelItems();
      const numSlices = items.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      // Random revolutions between 5 and 9 + random slice offset
      const extraRevolutions = (5 + Math.random() * 4) * 2 * Math.PI;
      const targetRandomOffset = Math.random() * 2 * Math.PI;
      const totalSpin = extraRevolutions + targetRandomOffset;
      const startAngle = wheelAngle;
      const finalAngle = startAngle + totalSpin;
      const duration = 4000;
      const startTime = performance.now();

      function animateSpin(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Exponential ease out (deceleration)
        const easeOut = 1 - Math.pow(1 - progress, 3.5);
        wheelAngle = startAngle + totalSpin * easeOut;

        drawWheelOnCanvas();

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          wheelAngle = finalAngle % (2 * Math.PI);

          // Calculate winning item at top pointer (-PI/2)
          let normalized = (-Math.PI / 2 - wheelAngle) % (2 * Math.PI);
          if (normalized < 0) normalized += 2 * Math.PI;
          const winningIdx = Math.floor(normalized / sliceAngle) % numSlices;
          wheelResult = items[winningIdx];

          const resBanner = $('#wheel-result-banner');
          if (resBanner) {
            resBanner.innerHTML = `<b style="color:var(--gold);font-size:22px" class="pop">🏆 Estratto: ${esc(wheelResult)}!</b>`;
          }

          if (spinBtn) spinBtn.disabled = false;
        }
      }

      requestAnimationFrame(animateSpin);
    }

    // ==========================================
    // GAME ROUND FLOW VIEWS
    // ==========================================
    function draw(v) {
      if (v.phase === 'lobby') {
        lobby(v);
        last = 'lobby';
        return;
      }
      lobbyRendered = false; // Reset so next return to lobby will perform full render

      const ok = v.players.filter(p => p.in);
      const r = v.result;
      const m = v.mode;
      let s = renderHostHeader();

      if (v.phase === 'loading') {
        s += `
          <div class="card elevated pop" style="text-align:center;padding:60px 24px;margin-top:20px">
            <div class="ai-sparkle-icon" style="font-size:56px;margin-bottom:16px">✨</div>
            <h1 style="font-size:44px">L'IA sta preparando il round…</h1>
            <p class="subtext" style="font-size:18px;margin-top:8px">Applicazione del tema: «${esc(v.theme || 'Classico')}»</p>
          </div>
        `;
      } else if (v.phase === 'answering') {
        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <h2>Round ${v.round}: Rispondete dai Telefoni</h2>
              <span class="status-pill">${ok.filter(p => p.answered).length}/${ok.length} Risposte Inviate</span>
            </div>
            ${qcard(v)}
            <div class="card elevated">
              <h3>Stato Risposte Giocatori</h3>
              ${tiles(ok, 'answered')}
            </div>
            ${btn('discuss', 'Mostra Subito le Risposte sullo Schermo', 'secondary')}
          </div>
        `;
      } else if (v.phase === 'discussion') {
        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <h1>${m === 'impostor' ? "Chi è l'Impostore?" : 'Tutte le Risposte'}</h1>
              <span class="status-pill" style="color:var(--gold);border-color:var(--border-gold)">Fase Discussione a Voce</span>
            </div>
            ${qcard(v)}
            <div class="card elevated">
              ${answers(v)}
            </div>
            ${btn('tovote', 'Passa al Voto sui Telefoni →', 'btn')}
          </div>
        `;
      } else if (v.phase === 'voting') {
        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <h2>${m === 'impostor' ? "Votate l'Impostore dal Telefono!" : m === 'best' ? 'Votate la Risposta Migliore!' : 'Votate il più probabile!'}</h2>
              <span class="status-pill">${ok.filter(p => p.voted).length}/${ok.length} Voti Ricevuti</span>
            </div>
            ${qcard(v)}
            ${answers(v)}
            <div class="card elevated">
              <h3>Giocatori al Voto</h3>
              ${tiles(ok, 'voted')}
            </div>
            ${btn('reveal', 'Rivela il Risultato 🏆', 'btn')}
          </div>
        `;
      } else if (v.phase === 'reveal') {
        const tl = `
          <div class="card elevated">
            <small style="color:var(--gold);font-weight:800;letter-spacing:0.04em">SPOGLIO DEI VOTI</small>
            <div style="font-size:18px;font-weight:700;margin-top:6px">
              ${(r.tally.map(t => `${esc(t.name)}: <b style="color:var(--gold)">${t.n}</b>`).join(' &nbsp;•&nbsp; ') || 'Nessun voto espresso')}
            </div>
          </div>
        `;

        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            ${m === 'impostor' ? `
              <div class="stamp">${r.caught ? 'BECCATO!' : "L'HA SFANGATA!"}</div>
              <div class="card elevated pop" style="gap:14px">
                <small style="color:var(--gold);font-weight:800">L'INFILTRATO ERA</small>
                <div class="q-text" style="color:var(--rose)">${esc(r.impostor)}</div>
                <div style="background:rgba(255,255,255,0.04);padding:16px;border-radius:12px;display:flex;flex-direction:column;gap:8px">
                  <span style="color:var(--emerald);font-weight:700;font-size:18px">Domanda per tutti: «${esc(r.q)}»</span>
                  <span style="color:var(--rose);font-weight:700;font-size:18px">Domanda impostore: «${esc(r.qi)}»</span>
                </div>
              </div>
              ${answers(v)}
              ${tl}
            ` : `
              <div class="card elevated pop" style="text-align:center;padding:32px">
                <small style="color:var(--gold);font-weight:800">${m === 'best' ? 'MIGLIOR RISPOSTA DELLA PARTITA' : 'IL PIÙ VOTATO DAL GRUPPO'}</small>
                <h1 style="color:var(--gold);margin-top:8px">${esc(r.winner || 'Nessuno')}</h1>
              </div>
              ${qcard({ q: r.q })}
              ${m === 'best' ? answers(v) : ''}
              ${tl}
            `}

            <div class="card elevated">
              <h2>Classifica del Campionato KJB</h2>
              ${tiles([...v.players].sort((a, b) => b.score - a.score))}
            </div>

            <div style="display:flex;gap:14px">
              ${btn('next', 'Prossimo Round →', 'btn')}
              ${btn('lobby', 'Torna alla Lobby', 'secondary')}
            </div>
          </div>
        `;
      }

      if (last !== v.phase || v.phase === 'answering' || v.phase === 'voting') {
        A.innerHTML = s;
        bind(['discuss', 'tovote', 'reveal', 'next', 'lobby']);
      }
      last = v.phase;
    }

    // Startup check for host session
    (async () => {
      try { H = JSON.parse(sessionStorage.getItem('ftHost') || '{}'); } catch(e) {}
      if (!H.room || !H.token) {
        const r = await fetch('/api/create', { method: 'POST' }).then(r => r.json());
        H = { room: r.room, token: r.token };
        try { sessionStorage.setItem('ftHost', JSON.stringify(H)); } catch(e) {}
      }
      ROOM = H.room;
      const es = live('id=host&token=' + H.token);
      es.onmessage = e => draw(JSON.parse(e.data));
      es.onerror = () => {
        if (es.readyState === 2) {
          try { sessionStorage.removeItem('ftHost'); } catch(e) {}
          location.reload();
        }
      };
    })();
  </script>
</body>
</html>
