<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zughi del KJB · Schermo Host & Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800;900&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap wide" id="app"></div>

  <script src="/qr.js"></script>
  <script src="/app.js"></script>
  <script>
    const A = $('#app');
    let H = {}, theme = '', mode = 'impostor', last = '', activePresetId = 'fanta';

    const HOST_MODES = [
      { id: 'impostor', name: "L'Impostore", icon: '🕵️', desc: "Tutti una domanda tranne uno. Chi è fuori tema?" },
      { id: 'best', name: 'Miglior Risposta', icon: '🏆', desc: "Sfida aperta con risposte anonime e voto della migliore." },
      { id: 'likely', name: 'Chi è più probabile?', icon: '👀', desc: "Votazione diretta tra i compagni di gioco." },
      { id: 'auto', name: "Scelta dell'IA", icon: '✨', desc: "L'IA decide la modalità più adatta al tema impostato." }
    ];

    const btn = (id, t, c) => `<button class="btn ${c || ''}" id="${id}">${t}</button>`;
    const act = t => api({ id: 'host', token: H.token, type: t, theme, mode });
    const bind = ids => ids.forEach(i => { const b = $('#' + i); if (b) b.onclick = () => act(i); });

    function drawQR() {
      const q = qrcode(0, 'M');
      const joinUrl = location.origin + '/?r=' + ROOM;
      q.addData(joinUrl);
      q.make();
      const qrEl = $('#qr');
      if (qrEl) qrEl.innerHTML = q.createSvgTag(5, 2);
    }

    function renderHostHeader(extra = '') {
      return `
        <header class="brand-header" style="margin-bottom:12px">
          <div class="brand-badge">
            ${kjbCrestSvg(56)}
            <div class="brand-title-wrap">
              <span class="brand-title" style="font-size:28px">Zughi del KJB</span>
              <span class="brand-subtitle">Console Host • Schermo Condiviso</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px">
            <span class="status-pill">
              <span class="status-dot"></span>
              Stanza Live: <b style="color:var(--text-main);margin-left:4px">${ROOM}</b>
            </span>
            ${extra}
          </div>
        </header>
      `;
    }

    function lobby(v) {
      const n = v.players.filter(p => p.online).length;

      if (last !== 'lobby') {
        A.innerHTML = `
          ${renderHostHeader()}

          <div class="host-layout">
            <!-- Left Column: Access PIN & Roster -->
            <div style="display:flex;flex-direction:column;gap:20px">
              <div class="room-pin-display">
                <small style="color:var(--gold);font-weight:800;letter-spacing:0.08em;text-transform:uppercase">INQUADRA O DIGITA IL CODICE</small>
                <div class="bigcode">${ROOM}</div>
                <div id="qr"></div>
                <p style="font-size:14px;color:var(--text-muted);margin-top:6px">
                  Collegati a <b style="color:var(--text-main)">${esc(location.host)}</b> con il tuo telefono
                </p>
              </div>

              <div class="card elevated">
                <div style="display:flex;align-items:center;justify-content:space-between">
                  <h3>Rosa Giocatori</h3>
                  <span class="status-pill">${n} Connessi</span>
                </div>
                <div id="ch"></div>
              </div>
            </div>

            <!-- Right Column: Game Selection & AI Director Customizer -->
            <div style="display:flex;flex-direction:column;gap:22px">
              <!-- Game Mode Selector -->
              <div class="card elevated" style="gap:14px">
                <div class="section-title-row">
                  <div>
                    <h3>1. Seleziona il Minigioco</h3>
                    <p class="subtext">Scegli la modalità per questo round</p>
                  </div>
                  <span style="font-size:13px;color:var(--gold);font-weight:700">🎮 Social Gamebox Engine</span>
                </div>

                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
                  ${HOST_MODES.map(m => `
                    <div class="game-card ${m.id === mode ? 'active-selected' : ''}" data-m="${m.id}" style="cursor:pointer;padding:16px">
                      <div style="display:flex;align-items:center;gap:10px">
                        <span style="font-size:24px">${m.icon}</span>
                        <div>
                          <div style="font-weight:800;font-family:var(--font-disp);font-size:16px">${esc(m.name)}</div>
                        </div>
                      </div>
                      <div style="font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.35">${esc(m.desc)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- AI Director Customizer (Key Feature) -->
              <div class="ai-director-card">
                <div class="ai-header-row">
                  <div class="ai-sparkle-title">
                    <span class="ai-sparkle-icon">✨</span>
                    <span>Direttore di Gioco & Regole AI</span>
                  </div>
                  <small id="ai-status" style="color:var(--gold);font-weight:700"></small>
                </div>

                <p class="subtext" style="font-size:14.5px">
                  Personalizza i contenuti e le regole del round. Scegli un preset rapido o scrivi il tuo prompt personalizzato:
                </p>

                <!-- Presets Pills -->
                <div>
                  <small style="font-weight:800;color:var(--gold);letter-spacing:0.04em;display:block;margin-bottom:8px">PRESET A TEMA VELOCI:</small>
                  <div class="presets-container">
                    ${AI_PRESETS.map(p => `
                      <button class="preset-chip ${p.id === activePresetId ? 'active' : ''}" data-p="${p.id}">
                        <span>${p.icon}</span>
                        <span>${esc(p.title)}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Custom Rule Textarea -->
                <div>
                  <small style="font-weight:800;color:var(--text-muted);display:block;margin-bottom:6px">ISTRUZIONI DETTAGLIATE PER L'IA (TEMA O REGOLE SPECIALI):</small>
                  <textarea class="ai-textarea" id="th" maxlength="500" placeholder="Scrivi qui il tema personalizzato o regole speciali (es. solo aneddoti dell'estate 2024, penitenze, slang romano...)"></textarea>
                  <div style="display:flex;justify-content:space-between;margin-top:6px">
                    <small id="char-count" style="color:var(--text-dim)">0/500 caratteri</small>
                    <small style="color:var(--emerald);font-weight:600">✓ Prompt trasmesso istantaneamente all'IA</small>
                  </div>
                </div>
              </div>

              <!-- Start Button -->
              ${btn('start', '', 'btn')}
            </div>
          </div>
        `;

        // Apply default preset if empty
        if (!theme && AI_PRESETS[0]) {
          theme = AI_PRESETS[0].prompt;
        }

        const thInput = $('#th');
        if (thInput) {
          thInput.value = theme;
          $('#char-count').textContent = theme.length + '/500 caratteri';
          thInput.oninput = e => {
            theme = e.target.value;
            $('#char-count').textContent = theme.length + '/500 caratteri';
          };
        }

        drawQR();

        // Mode cards binding
        document.querySelectorAll('[data-m]').forEach(b => {
          b.onclick = () => {
            mode = b.dataset.m;
            document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('active-selected', x === b));
          };
        });

        // Presets binding
        document.querySelectorAll('[data-p]').forEach(chip => {
          chip.onclick = () => {
            activePresetId = chip.dataset.p;
            document.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('active', x === chip));
            const found = AI_PRESETS.find(p => p.id === activePresetId);
            if (found) {
              theme = found.prompt;
              if (thInput) {
                thInput.value = theme;
                $('#char-count').textContent = theme.length + '/500 caratteri';
              }
            }
          };
        });

        $('#start').onclick = () => act('start');
      }

      // Update dynamic elements
      $('#ch').innerHTML = v.players.length ? tiles(v.players, 'online') : '<span style="color:var(--text-dim);font-size:15px">In attesa che i telefoni inquadrino il QR code...</span>';
      $('#start').disabled = n < 3;
      $('#start').innerHTML = n < 3 
        ? `<span>⏳ Servono almeno 3 giocatori connessi (${n}/3)</span>` 
        : `<span>🚀 Fischio d'Inizio • Round ${v.round + 1}</span>`;

      $('#ai-status').textContent = v.ai ? '● IA Attiva (Generazione Dinamica)' : '○ Modalità Offline (Domande Preimpostate)';
    }

    function draw(v) {
      if (v.phase === 'lobby') {
        lobby(v);
        last = 'lobby';
        return;
      }

      const ok = v.players.filter(p => p.in);
      const r = v.result;
      const m = v.mode;
      let s = renderHostHeader();

      if (v.phase === 'loading') {
        s += `
          <div class="card elevated pop" style="text-align:center;padding:60px 24px;margin-top:20px">
            <div class="ai-sparkle-icon" style="font-size:56px;margin-bottom:16px">✨</div>
            <h1 style="font-size:44px">L'IA sta preparando il round…</h1>
            <p class="subtext" style="font-size:18px;margin-top:8px">Applicazione del tema: «${esc(v.theme || 'Classico')}»</p>
          </div>
        `;
      } else if (v.phase === 'answering') {
        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <h2>Round ${v.round}: Rispondete dai Telefoni</h2>
              <span class="status-pill">${ok.filter(p => p.answered).length}/${ok.length} Risposte Inviate</span>
            </div>
            ${qcard(v)}
            <div class="card elevated">
              <h3>Stato Risposte Giocatori</h3>
              ${tiles(ok, 'answered')}
            </div>
            ${btn('discuss', 'Mostra Subito le Risposte sullo Schermo', 'secondary')}
          </div>
        `;
      } else if (v.phase === 'discussion') {
        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <h1>${m === 'impostor' ? "Chi è l'Impostore?" : 'Tutte le Risposte'}</h1>
              <span class="status-pill" style="color:var(--gold);border-color:var(--border-gold)">Fase Discussione a Voce</span>
            </div>
            ${qcard(v)}
            <div class="card elevated">
              ${answers(v)}
            </div>
            ${btn('tovote', 'Passa al Voto sui Telefoni →', 'btn')}
          </div>
        `;
      } else if (v.phase === 'voting') {
        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <h2>${m === 'impostor' ? "Votate l'Impostore dal Telefono!" : m === 'best' ? 'Votate la Risposta Migliore!' : 'Votate il più probabile!'}</h2>
              <span class="status-pill">${ok.filter(p => p.voted).length}/${ok.length} Voti Ricevuti</span>
            </div>
            ${qcard(v)}
            ${answers(v)}
            <div class="card elevated">
              <h3>Giocatori al Voto</h3>
              ${tiles(ok, 'voted')}
            </div>
            ${btn('reveal', 'Rivela il Risultato 🏆', 'btn')}
          </div>
        `;
      } else if (v.phase === 'reveal') {
        const tl = `
          <div class="card elevated">
            <small style="color:var(--gold);font-weight:800;letter-spacing:0.04em">SPOGLIO DEI VOTI</small>
            <div style="font-size:18px;font-weight:700;margin-top:6px">
              ${(r.tally.map(t => `${esc(t.name)}: <b style="color:var(--gold)">${t.n}</b>`).join(' &nbsp;•&nbsp; ') || 'Nessun voto espresso')}
            </div>
          </div>
        `;

        s += `
          <div style="display:flex;flex-direction:column;gap:24px;margin-top:10px">
            ${m === 'impostor' ? `
              <div class="stamp">${r.caught ? 'BECCATO!' : "L'HA SFANGATA!"}</div>
              <div class="card elevated pop" style="gap:14px">
                <small style="color:var(--gold);font-weight:800">L'INFILTRATO ERA</small>
                <div class="q-text" style="color:var(--rose)">${esc(r.impostor)}</div>
                <div style="background:rgba(255,255,255,0.04);padding:16px;border-radius:12px;display:flex;flex-direction:column;gap:8px">
                  <span style="color:var(--emerald);font-weight:700;font-size:18px">Domanda per tutti: «${esc(r.q)}»</span>
                  <span style="color:var(--rose);font-weight:700;font-size:18px">Domanda impostore: «${esc(r.qi)}»</span>
                </div>
              </div>
              ${answers(v)}
              ${tl}
            ` : `
              <div class="card elevated pop" style="text-align:center;padding:32px">
                <small style="color:var(--gold);font-weight:800">${m === 'best' ? 'MIGLIOR RISPOSTA DELLA PARTITA' : 'IL PIÙ VOTATO DAL GRUPPO'}</small>
                <h1 style="color:var(--gold);margin-top:8px">${esc(r.winner || 'Nessuno')}</h1>
              </div>
              ${qcard({ q: r.q })}
              ${m === 'best' ? answers(v) : ''}
              ${tl}
            `}

            <div class="card elevated">
              <h2>Classifica del Campionato KJB</h2>
              ${tiles([...v.players].sort((a, b) => b.score - a.score))}
            </div>

            <div style="display:flex;gap:14px">
              ${btn('next', 'Prossimo Round →', 'btn')}
              ${btn('lobby', 'Torna alla Lobby', 'secondary')}
            </div>
          </div>
        `;
      }

      if (last !== v.phase || v.phase === 'answering' || v.phase === 'voting') {
        A.innerHTML = s;
        bind(['discuss', 'tovote', 'reveal', 'next', 'lobby']);
      }
      last = v.phase;
    }

    // Startup check for host session
    (async () => {
      try { H = JSON.parse(sessionStorage.getItem('ftHost') || '{}'); } catch(e) {}
      if (!H.room || !H.token) {
        const r = await fetch('/api/create', { method: 'POST' }).then(r => r.json());
        H = { room: r.room, token: r.token };
        try { sessionStorage.setItem('ftHost', JSON.stringify(H)); } catch(e) {}
      }
      ROOM = H.room;
      const es = live('id=host&token=' + H.token);
      es.onmessage = e => draw(JSON.parse(e.data));
      es.onerror = () => {
        if (es.readyState === 2) {
          try { sessionStorage.removeItem('ftHost'); } catch(e) {}
          location.reload();
        }
      };
    })();
  </script>
</body>
</html>
