<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fuori Tema</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap" id="app"></div><script src="/app.js"></script><script>
const A=$('#app');let S={},photo=null,key='',es=null;
try{S=JSON.parse(localStorage.getItem('ft')||'{}');}catch(e){}
const save=()=>{try{localStorage.setItem('ft',JSON.stringify(S));}catch(e){}};
if(!S.id){S.id=Math.random().toString(36).slice(2,10);save();}
const urlRoom=(new URLSearchParams(location.search).get('r')||'').toUpperCase();

function home(){
  A.innerHTML='<div style="height:4vh"></div><h1 class="pop">Fuori<br>Tema</h1><p style="font-size:20px;margin:0">Tutti rispondono alla stessa domanda. Tutti tranne uno. Scoprilo prima che ti freghi.</p>'+
  '<div class="card"><div class="steps"><div><b>1</b>Rispondi alla tua domanda dal telefono</div><div><b>2</b>Leggete le risposte e discutete a voce</div><div><b>3</b>Votate chi è fuori tema</div></div></div>'+
  '<button class="btn" id="j">Entra in una partita</button><a class="btn ghost" href="/host">Crea una partita</a>';
  $('#j').onclick=join;
}
function join(){
  photo=null;
  A.innerHTML='<h2>Entra in partita</h2><div class="card"><label class="sel" for="f"><span id="pv"></span><b>Scatta un selfie</b><small>È la tua foto per tutta la partita</small></label><input id="f" type="file" accept="image/*" capture="user" hidden>'+
  '<small>Codice partita (lo vedi sullo schermo)</small><input class="txt code" id="c" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" value="'+esc(urlRoom||S.room||'')+'"><small>Il tuo nome</small><input class="txt" id="n" maxlength="14" placeholder="Come ti chiami?" autocomplete="off" value="'+esc(S.name||'')+'"><div class="err" id="e"></div></div><button class="btn" id="go">Entra</button><button class="btn ghost" id="b">Indietro</button>';
  const pv=()=>{$('#pv').innerHTML=photo?'<img class="av" style="--s:120px;object-fit:cover" src="'+photo+'">':'<span class="av" style="--s:120px;--c:#ffd93b;font-size:48px">📷</span>';};pv();
  $('#f').onchange=async e=>{if(e.target.files[0]){photo=await shrink(e.target.files[0]);pv();}};
  $('#b').onclick=home;
  $('#go').onclick=async()=>{const room=$('#c').value.trim().toUpperCase(),name=$('#n').value.trim();
    if(room.length!==4)return $('#e').textContent='Il codice ha 4 lettere.';
    if(!name)return $('#e').textContent='Scrivi il tuo nome.';
    $('#go').disabled=true;ROOM=room;
    const r=await api({type:'join',id:S.id,name,photo});
    if(r.error){$('#e').textContent=r.error;$('#go').disabled=false;return;}
    S.room=room;S.name=r.name;save();play();};
}
function play(){
  history.replaceState(null,'','/');key='';
  if(es)es.close();es=live('id='+S.id);es.onmessage=e=>draw(JSON.parse(e.data));es.onerror=()=>{if(es.readyState===2){S.room='';save();location.reload();}};
}
function draw(v){
  const me=v.me;
  if(!me){S.room='';save();return join();}
  const k=[v.phase,v.round,v.answered,v.voted,me.in,v.phase==='lobby'?v.players.map(p=>p.id+p.ph+p.online).join():me.score].join('|');
  if(k===key)return;key=k;
  let s='<div class="bar">'+av(me,46)+'<div style="text-align:left"><b>'+esc(me.name)+'</b><br><small>'+me.score+' punti</small></div><div><small>Partita</small><br><b class="disp">'+v.code+'</b></div></div>';
  const msg=(t,sub)=>'<div class="card pop"><h2>'+t+'</h2>'+(sub?'<span>'+sub+'</span>':'')+'</div>';
  const m=v.mode,inR=v.players.filter(p=>p.in);
  if(v.phase==='lobby')s+=msg('Sei dentro! 🎉','Aspetta che chi ospita faccia partire il round.')+tiles(v.players);
  else if(v.phase==='loading')s+=msg('L\'IA sta preparando il round…');
  else if(!me.in&&v.phase!=='reveal')s+=msg('Round in corso','Entri nel prossimo, tranquillo.');
  else if(v.phase==='answering'){
    s+=v.answered?msg('Risposta inviata ✓','Aspettiamo gli altri ('+inR.filter(p=>p.answered).length+'/'+inR.length+').')+tiles(inR,'answered')
     :'<div class="card dark pop"><small>La tua domanda</small><div class="q">'+esc(v.question)+'</div></div><input class="txt" id="a" maxlength="80" autocomplete="off" placeholder="'+(m==='best'?'Sii creativo!':'Rispondi in 1-3 parole')+'"><button class="btn" id="s">Invia risposta</button>';
  }else if(v.phase==='discussion')s+='<h2>'+(m==='impostor'?'Chi ha risposto in modo strano?':'Ecco le risposte')+'</h2>'+qcard(v)+answers(v)+'<div class="card dark"><span>'+(m==='impostor'?'Parlatene a voce: tra poco si vota.':'Leggetele, poi si vota.')+'</span></div>';
  else if(v.phase==='voting'){
    s+='<h2>'+(m==='impostor'?'Chi è l\'impostore?':m==='best'?'Qual è la migliore?':'Chi è il più probabile?')+'</h2>'+qcard(v)+(m==='likely'?'':answers(v))+
     (v.voted?msg('Voto inviato ✓','Aspettiamo gli altri ('+inR.filter(p=>p.voted).length+'/'+inR.length+').')
     :'<div class="list">'+inR.filter(p=>p.id!==me.id).map(p=>'<button class="btn ghost vote" data-v="'+p.id+'">'+av(p,52)+esc(p.name)+'</button>').join('')+'</div>');
  }else if(v.phase==='reveal'){
    const r=v.result,mine=r.impId===me.id,g=r.gain[me.id]||0;
    s+=(m==='impostor'?'<div class="stamp">'+(r.caught?'BECCATO!':'L\'HA SFANGATA!')+'</div><div class="card pop"><h2>'+(mine?'Eri tu l\'impostore!':'L\'impostore era '+esc(r.impostor))+'</h2><span>Tutti: «'+esc(r.q)+'»</span><span>Impostore: «'+esc(r.qi)+'»</span></div>'
      :'<div class="card pop"><small>'+(m==='best'?'Vince':'Il più votato')+'</small><h2>'+esc(r.winner||'nessuno')+'</h2></div>')+
      (m==='likely'?'':'<div class="card pop"><h2>+'+g+' punti</h2></div>')+'<h3>Classifica</h3>'+tiles([...v.players].sort((a,b)=>b.score-a.score));
  }
  A.innerHTML=s;
  const sb=$('#s');if(sb){const go=()=>{const t=$('#a').value;if(t.trim())api({type:'answer',id:S.id,text:t});};sb.onclick=go;$('#a').onkeydown=e=>e.key==='Enter'&&go();}
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>api({type:'vote',id:S.id,target:b.dataset.v}));
}
(async()=>{
  if(S.room&&!urlRoom){ROOM=S.room;const r=await api({type:'join',id:S.id,name:S.name});if(r.ok)return play();S.room='';save();}
  urlRoom?join():home();
})();
</script></body></html>
